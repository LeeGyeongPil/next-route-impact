# Static analysis only: no keys, no network services, no browser. Runs on the two supported Node lines.
name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # weekly: catch breakage from new dependency or runtime releases
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
